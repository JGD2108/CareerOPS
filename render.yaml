services:
  - type: web
    name: careerops-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    healthCheckPath: /health
    disk:
      name: careerops-storage
      mountPath: /storage
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: careerops-postgres
          property: connectionString
      - key: LOCAL_STORAGE_DIR
        value: /storage
      - key: GMAIL_CREDENTIALS_FILE
        value: /storage/secrets/gmail_credentials.json
      - key: GMAIL_TOKEN_FILE
        value: /storage/secrets/gmail_token.json
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_PROFILE_MODEL
        value: gpt-5-mini
      - key: OPENAI_EMAIL_MODEL
        value: gpt-5-nano
      - key: OPENAI_JOB_MODEL
        value: gpt-5-nano
      - key: OPENAI_CV_MODEL
        value: gpt-5-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "1536"
      - key: APP_AUTH_ENABLED
        value: "true"
      - key: APP_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GMAIL_CREDENTIALS_JSON
        sync: false
      - key: GMAIL_OAUTH_REDIRECT_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ENABLE_JOB_DISCOVERY_SCHEDULER
        value: "true"
      - key: DISCOVERY_SCHEDULE_HOUR
        value: "8"
      - key: DISCOVERY_SCHEDULE_MINUTE
        value: "0"
      - key: SCHEDULER_TIMEZONE
        value: America/Bogota

databases:
  - name: careerops-postgres
    plan: starter
    databaseName: careerops
    user: careerops
