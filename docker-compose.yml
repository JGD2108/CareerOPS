services:
  db:
    image: pgvector/pgvector:pg16
    container_name: careerops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: careerops
      POSTGRES_PASSWORD: careerops_dev_password
      POSTGRES_DB: careerops
    ports:
      - "5433:5432"
    volumes:
      - careerops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerops -d careerops"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: careerops_backend
    restart: unless-stopped
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://careerops:careerops_dev_password@db:5432/careerops
      LOCAL_STORAGE_DIR: /storage
      GMAIL_CREDENTIALS_FILE: /storage/secrets/gmail_credentials.json
      GMAIL_TOKEN_FILE: /storage/secrets/gmail_token.json
      GMAIL_OAUTH_REDIRECT_URI: http://127.0.0.1:8000/api/v1/gmail/oauth/callback
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
    container_name: careerops_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  careerops_pgdata:
