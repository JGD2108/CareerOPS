services:
  db:
    image: pgvector/pgvector:pg16
    container_name: careerops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: careerops
      POSTGRES_PASSWORD: careerops_dev_password
      POSTGRES_DB: careerops
    ports:
      - "5433:5432"
    volumes:
      - careerops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerops -d careerops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  careerops_pgdata:
